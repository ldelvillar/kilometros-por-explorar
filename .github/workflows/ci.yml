name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  frontend:
    runs-on: ubuntu-latest
    env:
      # Required by the env.schema in astro.config.mjs. CI never posts to them,
      # but the csp-endpoints-check build hook needs their origin in vercel.json's connect-src.
      PUBLIC_CONTACT_FORM_ENDPOINT: https://kilometros-por-explorar.onrender.com/contact
      PUBLIC_CHATBOT_WEBHOOK_ENDPOINT: https://kilometros-por-explorar.onrender.com/chatbot
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./backend typecheck
